<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add Player</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="app.js"></script>
  </head>
  <body>
    <nav>
      <button class="hamburger" id="hamburger" aria-label="Toggle menu" onclick="toggleMenu()">
        <span></span><span></span><span></span>
      </button>
      <div class="nav-links" id="navLinks">
        <a href="index.html">Home</a>
        <a href="addplayer.html">Add Player</a>
      </div>
    </nav>
    <h1>Add Player</h1>
    <form id="playerForm">
      <input id="username" placeholder="Username" required />
      <input id="firstname" placeholder="First name" required />
      <input id="lastname" placeholder="Last name" required />
      <input id="age" type="number" placeholder="Age" required />
      <select id="country">
        <option value="" hidden>Choose Country</option>
      </select>
      <label for="ranking">Level (1-100)</label>
      <input type="number" id="ranking" min="1" max="100" required />
      <br /><br />
      <select id="teamSelect"></select>
      <br /><br />
      <button id="add-btn">Add Player</button>
      <!-- Added type=button so button doesn't submit the form -->
      <button type="button" id="save-edit-btn" style="display: none">
        Save Edit
      </button>
    </form>
    <p id="error"></p>

    <script>
      renderAddPlayer();
    </script>
  </body>
</html>
