<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>E-sports Tournament</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <nav>
      <a href="index.html">Home</a>
      <a href="addplayer.html">Add Player</a>
    </nav>

    <h1>E-sports Tournament</h1>

    <div class="rename">
      <input id="teamAInput" placeholder="Rename Team A" />
      <button onclick="renameTeam('A')">Rename</button>

      <input id="teamBInput" placeholder="Rename Team B" />
      <button onclick="renameTeam('B')">Rename</button>
    </div>

    <div class="search-bar">
      <input
        id="searchInput"
        placeholder="Search players by username..."
        oninput="filterPlayers()" />
    </div>

    <div class="sort-bar">
      <select id="sort">
        <option value="" hidden>Sort by</option>
        <option value="original">Original Order</option>
        <option value="name-asc">Name (A-Z)</option>
        <option value="name-desc">Name (Z-A)</option>
        <option value="age-asc">Age (Youngest to Oldest)</option>
        <option value="age-desc">Age (Oldest to Youngest)</option>
        <option value="rank-asc">Rank (Lowest to Highest)</option>
        <option value="rank-desc">Rank (Higest to Lowest)</option>
      </select>
      <button class="sort-button" onclick="sortTeams()">sort</button>
    </div>

    <p class="sorted-by">Sorted by:</p>

    <div class="teams">
      <div class="team">
        <h2 id="teamAName"></h2>
        <ul id="teamAList"></ul>
      </div>

      <div class="team">
        <h2 id="teamBName"></h2>
        <ul id="teamBList"></ul>
      </div>
    </div>

    <div id="statistics"></div>

    <button onclick="showStatistics()">Show statistics</button>

    <script src="app.js"></script>
    <script>
      // If user no longer wants to edit player information
      localStorage.removeItem("editPlayer");
      renderHome();
    </script>
  </body>
</html>
