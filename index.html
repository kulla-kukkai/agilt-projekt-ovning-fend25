<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>E-sports Tournament</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <nav>
      <button class="hamburger" id="hamburger" aria-label="Toggle menu" onclick="toggleMenu()">
        <span></span><span></span><span></span>
      </button>
      <div class="nav-links" id="navLinks">
        <a href="index.html">Home</a>
        <a href="addplayer.html">Add Player</a>
      </div>
    </nav>

    <h1>E-sports Tournament</h1>

    <div class="rename">
      <input id="teamAInput" placeholder="Rename Team A" />
      <button onclick="renameTeam('A')">Rename</button>

      <input id="teamBInput" placeholder="Rename Team B" />
      <button onclick="renameTeam('B')">Rename</button>
    </div>

    <div class="search-bar">
      <input id="searchInput" placeholder="Search players by username..." oninput="filterPlayers()" />
    </div>

    <div class="teams">
      <div class="team">
        <h2 id="teamAName"></h2>
        <ul id="teamAList"></ul>
      </div>

      <div class="team">
        <h2 id="teamBName"></h2>
        <ul id="teamBList"></ul>
      </div>
    </div>

    <div id="statistics"></div>

    <button onclick="showStatistics()">Show statistics</button>

    <script src="app.js"></script>
    <script>
      // If user no longer wants to edit player information
      localStorage.removeItem("editPlayer");
      renderHome();
    </script>
  </body>
</html>
